# golangci-lint 설정 (v2). 실행: make lint
version: "2"

linters:
  # 기본 린터(errcheck, govet, ineffassign, staticcheck, unused)에 아래 린터들을 더한다.
  enable:
    - forbidigo # 금지한 호출(panic 등)을 막는다
    - revive # 아래 rules 에 적은 규칙만 켠다
    # 부작용이 적어 널리 쓰는 린터들
    - bodyclose # HTTP 응답 Body 를 닫지 않음
    - errorlint # err == ErrX 대신 errors.Is / errors.As
    - gocritic # 여러 코드 냄새
    - nolintlint # //nolint 에 린터 이름과 이유를 남겼는지
    - misspell # 영어 오타
    - unconvert # 불필요한 타입 변환
    - unparam # 항상 같은 값만 받는 인자, 안 쓰는 반환값
    - copyloopvar # Go 1.22 이후 불필요한 반복 변수 복사
    - intrange # for i := 0; i < n; i++ 대신 for i := range n
    - usestdlibvars # "200" 대신 http.StatusOK 같은 표준 상수
    - perfsprint # 불필요한 fmt.Sprintf, fmt.Errorf
    - exhaustive # enum switch 에서 빠진 case
    - sqlclosecheck # DB rows, statement 를 닫지 않음
    - rowserrcheck # rows.Err() 를 확인하지 않음

  settings:
    errcheck:
      exclude-functions:
        - (*flag.FlagSet).Parse # ExitOnError 로 만들어서 실패하면 알아서 종료한다
        - (github.com/jackc/pgx/v5.Tx).Rollback # 읽기 전용 트랜잭션 정리. 실패해도 할 일이 없다

    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: 예상되는 실패는 error 로 돌려주세요. 정말 필요하면 //nolint:forbidigo 와 이유를 남기세요
        - pattern: ^print(ln)?$
          msg: 내장 print 대신 fmt 를 쓰세요

    nolintlint:
      require-explanation: true # //nolint 뒤에 이유 필수
      require-specific: true # //nolint:린터이름 필수

    revive:
      rules:
        # main() 밖의 os.Exit, log.Fatal 금지. defer 와 recover 를 건너뛰고 바로 죽기 때문이다.
        - name: deep-exit

  exclusions:
    presets:
      # Close, Flush, fmt.Print 류의 반환 오류를 무시하는 것은 Go 관례라 지적하지 않는다.
      # 쓰기 파일의 Close 처럼 결과가 중요한 곳은 코드에서 직접 확인한다.
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, forbidigo] # 테스트의 가짜 서버, 일부러 일으키는 패닉
      - linters: [staticcheck]
        text: ST1005 # 오류 문구가 "Neon" 같은 고유명사로 시작할 수 있다
